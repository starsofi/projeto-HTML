<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- <Form> = Define um formulário
        <input>  = Campo de entrada(Com vários tipos: text, password, email, number, etc...)
        <label>  = Associa um texto descritivo a um <input>
            <textarea> =Area de texto maior.
                <select> e <option> = Criam menus suspensos (dropdowns)
                    <button> =Botão clicável
                        <fieldset> e <legend> =Agrupam e nomeiam partes de um formulário
                            <datalist> = Lista de sugestões para <input>-->
                                <h1>Formulário Completo</h1>

                                <form action="/enviar-dados" method="post">
                                    <fieldset>
                                        <legend>informções pessoais</legend>

                                      <label for="nome">Nome completo:</label>
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seuemail@euamosenai.com.br" required><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required><br>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" placeholder="Sua idade" required><br>
<label for="data">Data de nascimento</label>
<input type="date" id="data-nascimento" name="data-nascicmento" >


    <label for="genero">Gênero</label>
    <select name="genero" id="genero">
        <option value="masculino">Masculino</option>
        <option value="feminino">Feminino</option>
        <option value="outro">Outro</option>
        <option value="prefiro_nao_dizer">Prefiro não dizer</option>
    </select>
</fieldset>

<fieldset>
    <legend>Detalhes Adicionais</legend>

    <label for="bio">Sobre você:</label>
    <textarea id="bio" name="bio" rows="3" placeholder="Fale um pouco de você..."></textarea>
</fieldset>

<label for="linguagem">Linguagem Favorita:</label>
<input type="text" name="linguagem" id="linguagem" list="linguagens">
<datalist id="linguagens">
    <option value="HTML">
        <option value="CSS">
            <option value="JavaScript">
                <option value="Python">
                    <option value="Java">
</datalist>
</form>

</body>
</html>
